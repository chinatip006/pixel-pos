name: Monthly member downgrade
on:
  schedule:
    - cron: "0 0 1 * *"   # 00:00 UTC วันที่ 1 = 07:00 น. เวลาไทย วันที่ 1
  workflow_dispatch: {}    # เผื่ออยากกดรันมือได้ด้วย

jobs:
  call-downgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Call downgrade endpoint
        run: |
          curl -s -X POST https://pixel-pos-api.onrender.com/api/admin/downgrade-members \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
