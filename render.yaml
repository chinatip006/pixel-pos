services:
  - type: web
    name: pixel-pos-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o app ./cmd/api
    startCommand: ./app
    envVars:
      - key: DATABASE_URL
        sync: false   # ใส่เองใน Render dashboard จากค่า Supabase connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false   # ใส่โดเมน Firebase Hosting ของ frontend
      - key: SUPABASE_URL
        sync: false   # จาก Supabase > Project Settings > Data API
      - key: SUPABASE_SERVICE_KEY
        sync: false   # จาก Supabase > Project Settings > API Keys > service_role (secret)
      - key: PRODUCT_IMAGE_BUCKET
        value: product-images

# หมายเหตุ: เดิมมี service type: cron ที่นี่สำหรับงาน downgrade สมาชิกรายเดือน
# ย้ายไปใช้ GitHub Actions แทนแล้ว (ดู .github/workflows/downgrade-members.yml)
# เพราะ Render Cron Job ต้องมี instance แบบเสียเงินขั้นต่ำเสมอ ไม่มีแบบฟรี
# ต้องตั้ง GitHub Secret ชื่อ CRON_SECRET ให้เป็นค่าเดียวกับที่ตั้งใน pixel-pos-api ด้านบน
