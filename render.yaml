services:
  - type: web
    name: pixel-pos-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o app ./cmd/api
    startCommand: ./app
    envVars:
      - key: DATABASE_URL
        sync: false   # ใส่เองใน Render dashboard จากค่า Supabase connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false   # ใส่โดเมน Firebase Hosting ของ frontend
      - key: SUPABASE_URL
        sync: false   # จาก Supabase > Project Settings > Data API
      - key: SUPABASE_SERVICE_KEY
        sync: false   # จาก Supabase > Project Settings > API Keys > service_role (secret)
      - key: PRODUCT_IMAGE_BUCKET
        value: product-images

  - type: cron
    name: pixel-pos-downgrade-members
    runtime: go
    rootDir: backend
    # Render cron ใช้เวลา UTC เสมอ — วันที่ (day-of-month) ในช่อง cron อ้างอิงปฏิทิน UTC ไม่ใช่ปฏิทินไทย
    # ถ้าตั้ง "day-of-month = 1" กับชั่วโมงไหนก็ได้ที่ >16 UTC จะข้ามไปตรงกับวันที่ 2 เวลาไทยแทน (ของเดิม "0 20 1 * *" = 03:00 น. วันที่ 2 เวลาไทย ผิดไป 1 วัน)
    # ใช้ 00:00 UTC ของวันที่ 1 แทน = 07:00 น. เวลาไทย ของวันที่ 1 พอดี (ชั่วโมงเช้าสุดที่ day-of-month=1 แบบ UTC ยังตรงกับวันที่ 1 เวลาไทย)
    schedule: "0 0 1 * *"   # 07:00 น. เวลาไทย ของวันที่ 1 ทุกเดือน
    buildCommand: go build -o app ./cmd/api
    startCommand: >
      curl -s -X POST https://pixel-pos-api.onrender.com/api/admin/downgrade-members
      -H "X-Cron-Secret: $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false   # ต้องใส่ค่าเดียวกับที่ตั้งใน pixel-pos-api ด้านบน
